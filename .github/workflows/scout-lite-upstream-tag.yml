# Channel A. This is the only upstream-tag schedule.
# GitHub runs schedule from the default branch, so this starts after the file is on master.
# Latest stable tag: the newest GitHub Release that is not a draft and not a prerelease.
# Unchanged: exit 0. No summary and no AI.
# Changed: write the job summary and one notice, then exit 0. Do not open an issue.
# No firmware build, firmware PR, merge, release, or flash.

name: Scout Lite upstream tag

on:
  schedule:
    - cron: "19 4 * * *" # runs daily at 04:19 UTC

permissions:
  contents: read

concurrency:
  group: scout-lite-upstream-tag
  cancel-in-progress: false

jobs:
  check-stable-tag:
    name: Compare upstream stable tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Compare recorded tag
        shell: bash
        run: |
          set -euo pipefail

          status_file="docs/scout-lite/PROJECT_STATUS.md"
          key="scout-lite-upstream-stable-tag:"
          mapfile -t recorded_lines < <(grep -E "^${key} v[0-9]+[.][0-9]+[.][0-9]+$" "$status_file" || true)
          if [ "${#recorded_lines[@]}" -ne 1 ]; then
            echo "expected exactly one ${key} line in ${status_file}" >&2
            exit 1
          fi
          recorded="${recorded_lines[0]##* }"
          if ! [[ "$recorded" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "recorded tag is not a stable tag: ${recorded}" >&2
            exit 1
          fi

          latest=$(curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "User-Agent: pingequa-scout-lite-tag-check" \
            https://api.github.com/repos/justcallmekoko/ESP32Marauder/releases/latest \
            | jq -er '.tag_name | select(test("^v[0-9]+[.][0-9]+[.][0-9]+$"))')

          if [ "$latest" = "$recorded" ]; then
            exit 0
          fi

          release_url="https://github.com/justcallmekoko/ESP32Marauder/releases/tag/${latest}"
          {
            echo "### Upstream stable tag is newer than the recorded tag"
            echo
            echo "- Recorded tag: \`${recorded}\`"
            echo "- Latest upstream tag: \`${latest}\`"
            echo "- Upstream release: ${release_url}"
            echo
            echo "No issue is opened. This check does not build firmware, open a firmware PR, merge, release, or flash."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Upstream stable tag changed::recorded tag ${recorded}; latest upstream tag ${latest}; ${release_url}"
          exit 0
